applications:
  app:
    source:
      root: "/"
    type: "python:3.12"

    hooks:
      build: |
        set -eu
        pip install -r requirements.txt

    web:
      commands:
        start: "uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1"
      locations:
        "/":
          passthru: true

    mounts:
      "data":
        source: storage
        source_path: data

    variables:
      env:
        DB_PATH: "data/app.db"
        RELAYER_JSON: "data/relayer_gifts.json"
        GIFTS_IMG_DIR: "data/gifts"
        USERBOT_SESSION: "data/relayer"

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
